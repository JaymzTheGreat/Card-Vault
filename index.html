<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CardVault Pro - Gemini AI Scanner</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    
    * { box-sizing: border-box; }
    body { margin: 0; background: #0E1420; color: #F2ECDD; font-family: 'Inter', sans-serif; }
    ::selection { background: #3DDC97; color: #0E1420; }
    input, textarea, select, button { font-family: 'Inter', sans-serif; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SPORTS = ["Baseball", "Basketball", "Football", "Hockey", "Soccer", "Other"];
    const STATUSES = ["In hand", "Listed", "Sold"];
    const CARD_TYPES = ["Base", "Insert", "Autograph", "Relic", "1-of-1"];

    const SPORT_COLOR = {
      Baseball: "#3DDC97",
      Basketball: "#E2572B",
      Football: "#5B8DEF",
      Hockey: "#C084FC",
      Soccer: "#F2C94C",
      Other: "#8B93A3",
    };

    const emptyCard = () => ({
      id: crypto.randomUUID(),
      player: "",
      sport: "Baseball",
      year: new Date().getFullYear().toString(),
      brand: "",
      product: "",
      cardType: "Base",
      insertName: "",
      cardNumber: "",
      parallel: "",
      gradingCompany: "Raw",
      grade: "",
      certNumber: "",
      costBasis: "",
      estValue: "",
      status: "In hand",
      notes: "",
      addedAt: new Date().toISOString(),
    });

    function fmtMoney(v) {
      const n = parseFloat(v);
      if (isNaN(n)) return "—";
      return `$${n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    // Direct Gemini 2.5 Flash API Call
    async function analyzeCardWithGemini(base64Image, mimeType, apiKey) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      const prompt = `Analyze this trading card image carefully. Identify all visible details including player name, sport, year, brand/manufacturer, product set name, card type, insert set name (if applicable), card number, parallel/variation name, and grading slab details (company and numeric grade if slabbed).`;

      const jsonSchema = {
        type: "OBJECT",
        properties: {
          player: { type: "STRING", description: "Player or athlete full name" },
          sport: { type: "STRING", enum: SPORTS, description: "Sport classification" },
          year: { type: "STRING", description: "Release year" },
          brand: { type: "STRING", description: "Brand name (e.g. Topps, Panini, Upper Deck, Bowman)" },
          product: { type: "STRING", description: "Product line (e.g. Chrome, Prizm, Optic, Select, Heritage)" },
          cardType: { type: "STRING", enum: CARD_TYPES, description: "Type of card" },
          insertName: { type: "STRING", description: "Insert set name if cardType is Insert (e.g. Downtown, Kaboom, Stain Glass)" },
          cardNumber: { type: "STRING", description: "Card number on back or front without hash symbol" },
          parallel: { type: "STRING", description: "Parallel or refractor color variation (e.g. Silver Prizm, Gold /50, Red Refractor)" },
          gradingCompany: { type: "STRING", enum: ["Raw", "PSA", "BGS", "SGC", "CGC"], description: "Grading company if encased, otherwise Raw" },
          grade: { type: "STRING", description: "Numeric grade if graded, otherwise empty" },
          notes: { type: "STRING", description: "Brief visual details or condition summary" }
        },
        required: ["player", "sport", "year", "brand", "product", "cardType", "gradingCompany"]
      };

      const payload = {
        contents: [
          {
            parts: [
              { text: prompt },
              {
                inline_data: {
                  mime_type: mimeType,
                  data: base64Image
                }
              }
            ]
          }
        ],
        generationConfig: {
          response_mime_type: "application/json",
          response_schema: jsonSchema
        }
      };

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error (${res.status})`);
      }

      const data = await res.json();
      const textOutput = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!textOutput) throw new Error("No data returned from Gemini");
      return JSON.parse(textOutput);
    }

    function CardVaultPro() {
      const [cards, setCards] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [showForm, setShowForm] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [draft, setDraft] = useState(emptyCard());
      
      const [apiKey, setApiKey] = useState("");
      const [query, setQuery] = useState("");
      const [expandedId, setExpandedId] = useState(null);
      const [sportFilter, setSportFilter] = useState("All");

      // Scanner State
      const [scanning, setScanning] = useState(false);
      const [scanError, setScanError] = useState(null);
      const fileInputRef = useRef(null);

      // Load initial state
      useEffect(() => {
        try {
          const stored = localStorage.getItem("card_vault_inventory");
          if (stored) setCards(JSON.parse(stored));
          const storedKey = localStorage.getItem("gemini_api_key");
          if (storedKey) setApiKey(storedKey);
        } catch (e) {
          console.error("Failed to load collection", e);
        } finally {
          setLoaded(true);
        }
      }, []);

      // Persist state
      useEffect(() => {
        if (!loaded) return;
        try {
          localStorage.setItem("card_vault_inventory", JSON.stringify(cards));
        } catch (e) {
          console.error("Failed to persist cards", e);
        }
      }, [cards, loaded]);

      useEffect(() => {
        if (apiKey) localStorage.setItem("gemini_api_key", apiKey);
      }, [apiKey]);

      // Portfolio calculation
      const totals = useMemo(() => {
        const activeCards = cards.filter(c => c.status !== "Sold");
        const cost = activeCards.reduce((s, c) => s + (parseFloat(c.costBasis) || 0), 0);
        const value = activeCards.reduce((s, c) => s + (parseFloat(c.estValue) || 0), 0);
        const profit = value - cost;
        const roi = cost > 0 ? ((profit / cost) * 100).toFixed(1) : 0;
        return { count: activeCards.length, cost, value, profit, roi };
      }, [cards]);

      // Search & Filter
      const visibleCards = useMemo(() => {
        let list = cards;
        if (sportFilter !== "All") list = list.filter((c) => c.sport === sportFilter);
        if (query.trim()) {
          const q = query.toLowerCase();
          list = list.filter((c) => 
            c.player.toLowerCase().includes(q) ||
            c.brand.toLowerCase().includes(q) ||
            c.product.toLowerCase().includes(q) ||
            c.insertName.toLowerCase().includes(q) ||
            c.notes.toLowerCase().includes(q)
          );
        }
        return [...list].sort((a, b) => (b.addedAt || "").localeCompare(a.addedAt || ""));
      }, [cards, sportFilter, query]);

      function openAdd() {
        setDraft(emptyCard());
        setEditingId(null);
        setScanError(null);
        setShowForm(true);
      }

      function openEdit(card) {
        setDraft({ ...card });
        setEditingId(card.id);
        setScanError(null);
        setShowForm(true);
      }

      function saveDraft() {
        if (!draft.player.trim()) return;
        if (editingId) {
          setCards((prev) => prev.map((c) => (c.id === editingId ? draft : c)));
        } else {
          setCards((prev) => [draft, ...prev]);
        }
        setShowForm(false);
      }

      function removeCard(id) {
        setCards((prev) => prev.filter((c) => c.id !== id));
        if (expandedId === id) setExpandedId(null);
      }

      function handleFileUpload(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!apiKey.trim()) {
          setScanError("Please enter a Gemini API Key first.");
          return;
        }

        setScanning(true);
        setScanError(null);

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const dataUrl = evt.target.result;
            const mimeType = file.type || "image/jpeg";
            const base64Data = dataUrl.split(",")[1];

            const extracted = await analyzeCardWithGemini(base64Data, mimeType, apiKey.trim());
            
            setDraft((prev) => ({
              ...prev,
              player: extracted.player || prev.player,
              sport: SPORTS.includes(extracted.sport) ? extracted.sport : prev.sport,
              year: extracted.year || prev.year,
              brand: extracted.brand || prev.brand,
              product: extracted.product || prev.product,
              cardType: CARD_TYPES.includes(extracted.cardType) ? extracted.cardType : prev.cardType,
              insertName: extracted.insertName || prev.insertName,
              cardNumber: extracted.cardNumber || prev.cardNumber,
              parallel: extracted.parallel || prev.parallel,
              gradingCompany: ["Raw", "PSA", "BGS", "SGC", "CGC"].includes(extracted.gradingCompany) ? extracted.gradingCompany : prev.gradingCompany,
              grade: extracted.grade || prev.grade,
              notes: extracted.notes ? `AI Scan: ${extracted.notes}` : prev.notes,
            }));
          } catch (err) {
            console.error(err);
            setScanError(err.message || "Failed to scan card image.");
          } finally {
            setScanning(false);
            if (fileInputRef.current) fileInputRef.current.value = "";
          }
        };
        reader.readAsDataURL(file);
      }

      return (
        <div style={styles.app}>
          {/* Header */}
          <div style={styles.header}>
            <div style={styles.headerTop}>
              <div style={styles.brandRow}>
                <span style={styles.brand}>CARDVAULT <span style={styles.proBadge}>AI</span></span>
              </div>
              <button style={styles.addBtn} onClick={openAdd}>+ Add Card</button>
            </div>

            {/* Gemini API Key Bar */}
            <div style={styles.keyBar}>
              <span style={{ fontSize: 11, color: "#3DDC97", fontWeight: 600 }}>GEMINI KEY:</span>
              <input
                type="password"
                style={styles.keyInput}
                placeholder="Paste Gemini API Key for image scanning..."
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
              />
            </div>

            {/* Stats Dashboard */}
            <div style={styles.statsRow}>
              <div style={styles.stat}>
                <div style={styles.statLabel}>Vault Size</div>
                <div style={styles.statValue}>{totals.count}</div>
              </div>
              <div style={styles.statDivider} />
              <div style={styles.stat}>
                <div style={styles.statLabel}>Cost Basis</div>
                <div style={styles.statValue}>{fmtMoney(totals.cost)}</div>
              </div>
              <div style={styles.statDivider} />
              <div style={styles.stat}>
                <div style={styles.statLabel}>Est. Value</div>
                <div style={{ ...styles.statValue, color: "#3DDC97" }}>{fmtMoney(totals.value)}</div>
              </div>
              <div style={styles.statDivider} />
              <div style={styles.stat}>
                <div style={styles.statLabel}>ROI</div>
                <div style={{ ...styles.statValue, color: totals.profit >= 0 ? "#3DDC97" : "#E2572B" }}>
                  {totals.roi}%
                </div>
              </div>
            </div>
          </div>

          {/* Search */}
          <div style={styles.searchWrap}>
            <div style={styles.searchBar}>
              <input
                style={styles.searchInput}
                placeholder="Search player, set, brand, or notes..."
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
              {query && (
                <button style={styles.iconBtnGhost} onClick={() => setQuery("")}>✕</button>
              )}
            </div>
          </div>

          {/* Filters */}
          <div style={styles.chipRow}>
            {["All", ...SPORTS].map((s) => (
              <button
                key={s}
                onClick={() => setSportFilter(s)}
                style={{
                  ...styles.chip,
                  ...(sportFilter === s ? styles.chipActive : {}),
                  ...(sportFilter === s && s !== "All" ? { borderColor: SPORT_COLOR[s], color: SPORT_COLOR[s] } : {}),
                }}
              >
                {s}
              </button>
            ))}
          </div>

          {/* Collection List */}
          <div style={styles.list}>
            {!loaded ? (
              <div style={styles.emptyState}>Loading Vault...</div>
            ) : visibleCards.length === 0 ? (
              <div style={styles.emptyState}>
                <div style={styles.emptyTitle}>No cards found</div>
                <div style={styles.emptySub}>Add your first card or adjust your filter parameters.</div>
                <button style={styles.emptyBtn} onClick={openAdd}>+ Add Card</button>
              </div>
            ) : (
              visibleCards.map((c) => (
                <CardSlab
                  key={c.id}
                  card={c}
                  expanded={expandedId === c.id}
                  onToggle={() => setExpandedId(expandedId === c.id ? null : c.id)}
                  onEdit={() => openEdit(c)}
                  onDelete={() => removeCard(c.id)}
                />
              ))
            )}
          </div>

          {/* Form Modal */}
          {showForm && (
            <div style={styles.modalOverlay} onClick={() => setShowForm(false)}>
              <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
                <div style={styles.modalHeader}>
                  <span style={styles.modalTitle}>{editingId ? "Edit Card Details" : "Add Card to Vault"}</span>
                  <button style={styles.iconBtnGhost} onClick={() => setShowForm(false)}>✕</button>
                </div>
                
                <div style={styles.modalBody}>
                  {/* Gemini Scanner Bar */}
                  <div style={styles.aiScanBox}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#3DDC97" }}>✦ Gemini AI Auto-Scan</span>
                      <button
                        style={styles.scanTriggerBtn}
                        onClick={() => fileInputRef.current?.click()}
                        disabled={scanning}
                      >
                        {scanning ? "Scanning Image..." : "Upload Card Photo"}
                      </button>
                    </div>
                    <input
                      type="file"
                      ref={fileInputRef}
                      accept="image/*"
                      style={{ display: "none" }}
                      onChange={handleFileUpload}
                    />
                    {scanError && <div style={styles.errorText}>{scanError}</div>}
                  </div>

                  <Field label="Player Name *" value={draft.player} onChange={(v) => setDraft({ ...draft, player: v })} placeholder="Ronald Acuña Jr." />
                  <Row>
                    <Field label="Sport" select value={draft.sport} onChange={(v) => setDraft({ ...draft, sport: v })} options={SPORTS} />
                    <Field label="Year" value={draft.year} onChange={(v) => setDraft({ ...draft, year: v })} placeholder="2023" />
                  </Row>
                  <Row>
                    <Field label="Brand" value={draft.brand} onChange={(v) => setDraft({ ...draft, brand: v })} placeholder="Topps" />
                    <Field label="Product" value={draft.product} onChange={(v) => setDraft({ ...draft, product: v })} placeholder="Chrome" />
                  </Row>
                  <Row>
                    <Field label="Type" select value={draft.cardType} onChange={(v) => setDraft({ ...draft, cardType: v })} options={CARD_TYPES} />
                    <Field label="Subset/Insert" value={draft.insertName} onChange={(v) => setDraft({ ...draft, insertName: v })} placeholder="Downtown" disabled={draft.cardType === "Base"} />
                  </Row>
                  <Row>
                    <Field label="Card #" value={draft.cardNumber} onChange={(v) => setDraft({ ...draft, cardNumber: v })} placeholder="150" />
                    <Field label="Parallel" value={draft.parallel} onChange={(v) => setDraft({ ...draft, parallel: v })} placeholder="Refractor" />
                  </Row>
                  <Row>
                    <Field label="Grading Co." select value={draft.gradingCompany} onChange={(v) => setDraft({ ...draft, gradingCompany: v })} options={["Raw", "PSA", "BGS", "SGC", "CGC"]} />
                    <Field label="Grade" value={draft.grade} onChange={(v) => setDraft({ ...draft, grade: v })} placeholder="10" disabled={draft.gradingCompany === "Raw"} />
                  </Row>
                  <Row>
                    <Field label="Cost Basis ($)" value={draft.costBasis} onChange={(v) => setDraft({ ...draft, costBasis: v })} placeholder="12.00" mono />
                    <Field label="Est. Value ($)" value={draft.estValue} onChange={(v) => setDraft({ ...draft, estValue: v })} placeholder="35.00" mono />
                  </Row>
                  <Field label="Status" select value={draft.status} onChange={(v) => setDraft({ ...draft, status: v })} options={STATUSES} />
                  <Field label="Notes" value={draft.notes} onChange={(v) => setDraft({ ...draft, notes: v })} placeholder="Condition details, centering, sales history..." textarea />
                </div>
                
                <div style={styles.modalFooter}>
                  <button style={styles.cancelBtn} onClick={() => setShowForm(false)}>Cancel</button>
                  <button style={styles.saveBtn} onClick={saveDraft} disabled={!draft.player.trim() || scanning}>
                    {editingId ? "Save Changes" : "Save to Vault"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function CardSlab({ card, expanded, onToggle, onEdit, onDelete }) {
      const color = SPORT_COLOR[card.sport] || "#8B93A3";
      const gradeLabel = card.gradingCompany === "Raw" ? "RAW" : `${card.gradingCompany} ${card.grade || "—"}`;
      
      return (
        <div style={{ ...styles.slab, borderLeftColor: color }}>
          <div style={styles.slabRow} onClick={onToggle}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={styles.slabPlayer}>{card.player || "Untitled Card"}</div>
              <div style={styles.slabMeta}>
                {card.year} {card.brand} {card.product} {card.cardType !== "Base" && card.insertName ? `· ${card.insertName}` : ""} {card.cardNumber ? `#${card.cardNumber}` : ""} {card.parallel}
              </div>
            </div>
            <div style={styles.slabRight}>
              <div style={{ ...styles.gradePill, borderColor: color, color }}>{gradeLabel}</div>
              <div style={styles.slabValue}>{fmtMoney(card.estValue)}</div>
            </div>
            <div style={{ marginLeft: 8, color: "#8B93A3", transform: expanded ? "rotate(180deg)" : "none" }}>▼</div>
          </div>

          {expanded && (
            <div style={styles.slabDetail}>
              <DetailRow label="Status" value={card.status} />
              <DetailRow label="Cost Basis" value={fmtMoney(card.costBasis)} mono />
              <DetailRow label="Est. Market Value" value={fmtMoney(card.estValue)} mono />
              {card.notes && <DetailRow label="Notes" value={card.notes} />}
              <div style={styles.detailActions}>
                <button style={styles.smallBtn} onClick={onEdit}>Edit</button>
                <button style={{ ...styles.smallBtn, color: "#E2572B", borderColor: "#E2572B33" }} onClick={onDelete}>Remove</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function DetailRow({ label, value, mono }) {
      return (
        <div style={styles.detailRow}>
          <span style={styles.detailLabel}>{label}</span>
          <span style={{ ...styles.detailValue, fontFamily: mono ? "'IBM Plex Mono', monospace" : "inherit" }}>{value}</span>
        </div>
      );
    }

    function Row({ children }) { return <div style={{ display: "flex", gap: 10 }}>{children}</div>; }

    function Field({ label, value, onChange, placeholder, select, options, textarea, mono, disabled }) {
      return (
        <label style={{ display: "block", flex: 1, marginBottom: 12 }}>
          <div style={styles.fieldLabel}>{label}</div>
          {select ? (
            <select style={styles.input} value={value} onChange={(e) => onChange(e.target.value)}>
              {options.map((o) => <option key={o} value={o}>{o}</option>)}
            </select>
          ) : textarea ? (
            <textarea style={{ ...styles.input, height: 60, resize: "none" }} value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
          ) : (
            <input style={{ ...styles.input, fontFamily: mono ? "'IBM Plex Mono', monospace" : "inherit", opacity: disabled ? 0.4 : 1 }} value={value} placeholder={placeholder} disabled={disabled} onChange={(e) => onChange(e.target.value)} />
          )}
        </label>
      );
    }

    const styles = {
      app: { minHeight: "100vh", background: "#0E1420", color: "#F2ECDD", maxWidth: 500, margin: "0 auto", paddingBottom: 40 },
      header: { padding: "20px 16px 16px", borderBottom: "1px solid #1E2634", position: "sticky", top: 0, background: "#0E1420", zIndex: 10 },
      headerTop: { display: "flex", justifyContent: "space-between", alignItems: "center" },
      brandRow: { display: "flex", alignItems: "center", gap: 8 },
      brand: { fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 20, letterSpacing: "0.08em", color: "#F2ECDD" },
      proBadge: { fontSize: 10, background: "#3DDC9722", color: "#3DDC97", padding: "2px 6px", borderRadius: 4, border: "1px solid #3DDC9744" },
      addBtn: { background: "#3DDC97", border: "none", borderRadius: 8, padding: "8px 14px", color: "#0E1420", fontWeight: 600, cursor: "pointer" },
      keyBar: { display: "flex", alignItems: "center", gap: 8, background: "#161D2B", padding: "6px 10px", borderRadius: 8, marginTop: 12, border: "1px solid #263042" },
      keyInput: { flex: 1, background: "transparent", border: "none", color: "#F2ECDD", fontSize: 11.5, outline: "none" },
      statsRow: { display: "flex", alignItems: "center", marginTop: 12, gap: 10, background: "#161D2B", padding: "10px 12px", borderRadius: 10, border: "1px solid #263042" },
      stat: { flex: 1, textAlign: "center" },
      statDivider: { width: 1, height: 24, background: "#263042" },
      statLabel: { fontSize: 9.5, color: "#8B93A3", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 2 },
      statValue: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 13.5, fontWeight: 600, color: "#F2ECDD" },
      searchWrap: { padding: "14px 16px 0" },
      searchBar: { display: "flex", alignItems: "center", gap: 8, background: "#161D2B", border: "1px solid #263042", borderRadius: 12, padding: "10px 12px" },
      searchInput: { flex: 1, background: "transparent", border: "none", outline: "none", color: "#F2ECDD", fontSize: 13.5 },
      chipRow: { display: "flex", gap: 6, overflowX: "auto", padding: "12px 16px 0" },
      chip: { background: "#161D2B", border: "1px solid #263042", borderRadius: 20, padding: "5px 12px", fontSize: 12, color: "#8B93A3", cursor: "pointer", whiteSpace: "nowrap" },
      chipActive: { background: "#0E1420", borderColor: "#F2ECDD", color: "#F2ECDD" },
      list: { padding: "16px" },
      emptyState: { textAlign: "center", padding: "40px 20px", color: "#8B93A3" },
      emptyTitle: { fontSize: 16, color: "#F2ECDD", fontWeight: 600, marginBottom: 4 },
      emptySub: { fontSize: 13, marginBottom: 16 },
      emptyBtn: { background: "#3DDC97", color: "#0E1420", border: "none", borderRadius: 8, padding: "8px 16px", fontWeight: 600, cursor: "pointer" },
      slab: { background: "#161D2B", borderRadius: 10, border: "1px solid #263042", borderLeftWidth: 4, marginBottom: 10, overflow: "hidden" },
      slabRow: { display: "flex", alignItems: "center", padding: "12px 14px", cursor: "pointer", gap: 10 },
      slabPlayer: { fontSize: 14.5, fontWeight: 600, color: "#F2ECDD" },
      slabMeta: { fontSize: 12, color: "#8B93A3", marginTop: 2 },
      slabRight: { textAlign: "right" },
      gradePill: { display: "inline-block", fontSize: 10, fontWeight: 600, border: "1px solid", borderRadius: 4, padding: "1px 5px", marginBottom: 4 },
